<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VirtualLab — Электронный учебник</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-module="theory" class="h-screen flex flex-col font-sans overflow-hidden select-none">
    <header class="ui-header h-14 px-4 flex items-center justify-between shrink-0 z-10">
        <div class="flex items-center space-x-4">
            <a href="../index.html" class="ui-btn ui-btn-secondary py-1.5 px-2.5">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Главная</span>
            </a>

            <div class="h-4 w-px bg-[var(--border-color)]"></div>

            <div class="flex items-center space-x-2">
                <span class="w-2.5 h-2.5 rounded-full bg-[var(--accent)] animate-pulse"></span>
                <h1 class="text-base font-extrabold tracking-wide text-[var(--text-main)]">
                    VirtualLab <span class="text-xs font-semibold text-blue-500">Theory</span>
                </h1>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <button id="theme-toggle" type="button" class="ui-theme-btn">Светлая</button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden">
        <aside class="w-64 bg-[var(--bg-panel)] border-r border-[var(--border-color)] flex flex-col shrink-0">
            <div class="p-4 ui-divider-b">
                <div class="flex justify-between items-center mb-1.5">
                    <span class="text-[10px] font-bold uppercase tracking-wider text-[var(--text-muted)]">Прогресс курса</span>
                    <span id="overall-progress-text" class="text-[10px] font-mono text-blue-500 font-bold">0%</span>
                </div>

                <div class="w-full bg-[var(--bg-elevated)] h-2 rounded-full overflow-hidden border border-[var(--border-color)]">
                    <div id="overall-progress-bar" class="bg-[var(--accent)] h-full w-0 transition-all duration-500"></div>
                </div>
            </div>

            <nav id="course-menu" class="flex-1 overflow-y-auto p-3 space-y-1 text-xs">
                <div class="text-[var(--text-muted)] p-2 animate-pulse">Загрузка оглавления...</div>
            </nav>
        </aside>

        <main id="lesson-content" class="flex-1 overflow-y-auto p-8 space-y-6 bg-[var(--bg-main)]">
            <div class="max-w-2xl mx-auto text-[var(--text-muted)] animate-pulse">
                Загрузка материала урока...
            </div>
        </main>

        <aside class="w-80 bg-[var(--bg-panel)] border-l border-[var(--border-color)] flex flex-col p-4 space-y-4 shrink-0">
            <div class="flex items-center justify-between ui-divider-b pb-2">
                <h3 class="text-xs font-bold uppercase tracking-wider text-[var(--text-muted)]">Интерактивная модель</h3>
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            </div>

            <div id="widget-sidebar-container" class="space-y-4 flex-1 flex flex-col">
                <div class="text-xs text-[var(--text-muted)] italic">Выберите урок для загрузки интерактивной модели...</div>
            </div>
        </aside>
    </div>

    <script src="../src/skeleton.js"></script>
    <script src="../src/toast.js"></script>
    <script src="../src/theme.js"></script>
    <script src="src/loader.js"></script>
    <script src="src/widget-registry.js"></script>
    <script src="src/ray-sphere-demo.js"></script>
    <script src="src/diffuse-demo.js"></script>
    <script src="src/specular-reflection-demo.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</body>
</html>
