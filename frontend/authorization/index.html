<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация | VirtualLab Edu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
</head>
<body class="bg-[var(--bg-panel)] text-[var(--text-main)] font-sans min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-[var(--bg-panel)] border border-gray-700 rounded-2xl shadow-2xl p-8 space-y-6">
        
        <!-- Логотип -->
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-pink-500/10 mb-2">
                <i class="fa-solid fa-graduation-cap text-pink-500 text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-wide">VirtualLab <span class="text-pink-400">Edu</span></h1>
            <p class="text-sm text-gray-400">Вход в систему обучения Ray и Path Tracing </p>
        </div>

        <!-- Уведомление об ошибке -->
        <div id="error-alert" class="hidden bg-red-500/10 border border-red-500 text-red-400 text-sm rounded-xl p-3 flex items-center space-x-2">
            <i class="fa-solid fa-circle-exclamation text-red-400"></i>
            <span id="error-message">Неверный логин или пароль</span>
        </div>

        <!-- Форма авторизации -->
        <form id="login-form" class="space-y-4">
            <div>
                <label for="email" class="block text-xs font-semibold uppercase text-gray-400 mb-1">Email / Логин</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                        <i class="fa-solid fa-envelope"></i>
                    </span>
                    <input type="email" id="email" required placeholder="student@edu.ru" 
                           class="w-full pl-10 pr-4 py-2.5 bg-[var(--bg-card)] border border-gray-700 rounded-xl focus:outline-none focus:border-pink-500 text-sm text-[var(--text-main)] transition">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold uppercase text-gray-400 mb-1">Пароль</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="password" required placeholder="••••••••" 
                           class="w-full pl-10 pr-4 py-2.5 bg-[var(--bg-card)] border border-gray-700 rounded-xl focus:outline-none focus:border-pink-500 text-sm text-[var(--text-main)] transition">
                </div>
            </div>

            <button type="submit" id="submit-btn" 
                    class="w-full bg-pink-600 hover:bg-pink-500 text-white font-semibold py-2.5 px-4 rounded-xl shadow-lg shadow-pink-600/20 transition duration-200 flex items-center justify-center space-x-2">
                <span>Войти в систему</span>
                <i class="fa-solid fa-arrow-right text-sm"></i>
            </button>
        </form>
    </div>

    <script src="src/ui.js"></script>
</body>
</html>
