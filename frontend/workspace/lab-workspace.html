<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VirtualLab — Workspace</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-module="labs" class="h-screen overflow-hidden flex flex-col font-sans select-none">
    <header class="ui-header h-14 px-4 flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-4">
            <a href="index.html" class="ui-btn ui-btn-secondary py-1.5 px-2.5">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Лабораторные</span>
            </a>

            <div class="h-4 w-px bg-[var(--border-color)]"></div>

            <div class="flex items-center space-x-2.5">
                <span class="w-2.5 h-2.5 rounded-full bg-[var(--accent)] animate-pulse"></span>
                <h1 id="header-title" class="text-base font-extrabold tracking-wide text-[var(--text-main)]">
                    Загрузка лабораторной...
                </h1>
            </div>
        </div>

        <div class="flex items-center space-x-2.5">
            <button id="theme-toggle" type="button" class="ui-theme-btn">Светлая</button>

            <button id="btn-save-draft" type="button" class="ui-btn ui-btn-secondary py-1.5 px-3" title="Сохранить код без отправки">
                <i class="fa-solid fa-floppy-disk"></i>
            </button>

            <button id="btn-run" type="button" class="ui-btn ui-btn-primary py-1.5 px-3.5">
                <i class="fa-solid fa-play text-[10px]"></i>
                <span>Run</span>
            </button>

            <button id="btn-submit" type="button" class="ui-btn bg-pink-600 hover:bg-pink-500 text-white py-1.5 px-3.5 shadow-lg shadow-pink-600/20">
                Отправить решение
            </button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden">
        <aside class="w-72 bg-[var(--bg-panel)] border-r border-[var(--border-color)] flex flex-col justify-between shrink-0">
            <div class="p-4 space-y-4 overflow-y-auto text-xs leading-relaxed">
                
                <div id="teacher-feedback-banner" class="hidden"></div>

                <div class="pb-2 ui-divider-b flex justify-between items-center">
                    <span class="text-[11px] font-bold text-[var(--text-muted)] uppercase tracking-wider">Задание</span>
                    <span id="lab-badge-category" class="px-2 py-0.5 rounded text-[10px] bg-emerald-500/10 text-emerald-500 border border-emerald-500/20 font-mono font-semibold">
                        C++
                    </span>
                </div>

                <div class="space-y-2">
                    <h2 id="lab-instruction-title" class="text-sm font-bold text-[var(--text-main)]">...</h2>
                    <p id="lab-instruction-text" class="text-[var(--text-muted)]">Загрузка инструкции...</p>
                </div>

                <div class="ui-subcard p-3 space-y-1.5">
                    <span class="font-bold text-amber-500 flex items-center space-x-1">
                        <span>⚠️ Требования:</span>
                    </span>
                    <ul id="lab-requirements-list" class="list-disc list-inside text-[var(--text-muted)] space-y-1 text-[11px]">
                        <li>Загрузка требований...</li>
                    </ul>
                </div>
            </div>
        </aside>

        <main class="flex-1 bg-[var(--bg-main)] flex flex-col overflow-hidden relative">
            <div class="h-10 bg-[var(--bg-panel)] ui-divider-b px-4 flex items-center justify-between text-xs shrink-0">
                <div class="flex items-center space-x-2.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>

                    <select id="language-select" class="ui-select font-mono px-2.5 py-1 cursor-pointer">
                        <option value="cpp">C++15</option>
                        <option value="python">Python 3</option>
                        <option value="csharp">C# (.NET)</option>
                        <option value="go">Go</option>
                    </select>
                </div>

                <span id="compiler-badge" class="text-[10px] font-mono text-[var(--text-muted)]">Compiler: g++-15</span>
            </div>

            <div id="monaco-editor-container" class="flex-1 w-full h-full"></div>
        </main>

        <aside class="w-80 bg-[var(--bg-panel)] border-l border-[var(--border-color)] flex flex-col shrink-0 overflow-hidden">
            <div class="h-1/2 p-3 flex flex-col space-y-2 overflow-hidden">
                <div class="text-[11px] font-bold text-[var(--text-muted)] uppercase tracking-wider flex justify-between items-center">
                    <span>Unit-тесты</span>
                    <span id="tests-status-count"></span>
                </div>

                <div id="tests-container" class="flex-1 overflow-y-auto space-y-2 pr-1">
                    <div class="text-xs text-[var(--text-muted)] p-2">Загрузка тестов...</div>
                </div>
            </div>
        </aside>
    </div>

    <script src="../src/draft-guard.js"></script>
    <script src="../src/skeleton.js"></script>
    <script src="../src/toast.js"></script>
    <script src="src/ui.js"></script>
    <script src="src/loader.js"></script>
    <script src="src/runner.js"></script>
    <script src="../src/theme.js"></script>
    <script src="../src/language.js"></script>
    <script src="../src/notifications.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
</body>
</html>
