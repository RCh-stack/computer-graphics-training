<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VirtualLab — Рабочая область лабораторной</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/frontend/style.css">
</head>
<body class="bg-[var(--bg-main)] text-[var(--text-main)] h-screen overflow-hidden flex flex-col font-sans select-none">

    <!-- ВЕРХНИЙ БАР -->
    <header class="h-14 bg-[var(--bg-panel)] border-b border-[var(--border-color)] px-4 flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-4">
            <a href="index.html" class="flex items-center space-x-1.5 bg-[var(--bg-card)] hover:bg-gray-800 border border-[var(--border-color)] px-2.5 py-1 rounded-lg text-xs font-semibold transition text-[var(--text-main)]">
                <span>←</span>
                <span>Лабораторные</span>
            </a>

            <div class="h-4 w-px bg-[var(--border-color)]"></div>

            <div class="flex items-center space-x-2">
                <span class="w-3 h-3 rounded-full bg-[var(--accent)] animate-pulse"></span>
                <!-- ДИНАМИЧЕСКИЙ ЗАГОЛОВОК ЛАБОРАТОРНОЙ -->
                <h1 id="header-title" class="text-base font-extrabold tracking-wide text-[var(--text-main)]">
                    Загрузка лабораторной...
                </h1>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <button id="theme-toggle" class="bg-[var(--bg-card)] border border-[var(--border-color)] text-[var(--text-main)] px-2.5 py-1 rounded-lg text-xs font-semibold">
                🌙 Тёмная
            </button>
            <div id="wasm-status" class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20">
                Wasm ready
            </div>
            <button id="btn-run" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition flex items-center space-x-1 shadow-md">
                <span>▶ Тесты</span>
            </button>
            <button id="btn-submit" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition shadow-md">
                Отправить решение
            </button>
        </div>
    </header>

    <!-- ОСНОВНАЯ РАБОЧАЯ ОБЛАСТЬ (3 КОЛОНКИ) -->
    <div class="flex-1 flex overflow-hidden">

        <!-- 1. ЛЕВАЯ ПАНЕЛЬ: ОПИСАНИЕ И ТЕОРИЯ -->
        <aside class="w-72 bg-[var(--bg-panel)] border-r border-[var(--border-color)] flex flex-col justify-between shrink-0">
            <div class="p-4 space-y-4 overflow-y-auto text-xs leading-relaxed">
                <div class="pb-2 border-b border-[var(--border-color)] flex justify-between items-center">
                    <span class="text-[11px] font-bold text-[var(--text-main)] uppercase tracking-wider">Задание</span>
                    <span id="lab-badge-category" class="px-2 py-0.5 rounded text-[10px] bg-pink-500/10 text-pink-400 border border-pink-500/20 font-mono">
                        C++
                    </span>
                </div>

                <div class="space-y-2">
                    <h2 id="lab-instruction-title" class="text-sm font-bold text-[var(--text-main)]">...</h2>
                    <p id="lab-instruction-text" class="text-[var(--text-muted)]">Загрузка инструкции...</p>
                </div>

                <div class="bg-[var(--bg-card)] p-3 rounded-xl border border-[var(--border-color)] space-y-1.5">
                    <span class="font-bold text-amber-400 flex items-center space-x-1">
                        <span>⚠️ Требования:</span>
                    </span>
                    <!-- ДИНАМИЧЕСКИЙ СПИСОК ТРЕБОВАНИЙ -->
                    <ul id="lab-requirements-list" class="list-disc list-inside text-[var(--text-muted)] space-y-1 text-[11px]">
                        <li>Загрузка требований...</li>
                    </ul>
                </div>
            </div>
        </aside>

        <!-- 2. ЦЕНТРАЛЬНАЯ ОБЛАСТЬ: РЕДАКТОР КОДА -->
        <main class="flex-1 bg-black flex flex-col overflow-hidden relative">
            <div class="h-9 bg-[var(--bg-panel)] border-b border-[var(--border-color)] px-4 flex items-center justify-between text-xs shrink-0">
                <div class="flex items-center space-x-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                    <span id="editor-filename" class="font-mono text-[var(--text-main)]">solution.cpp</span>
                </div>
                <span class="text-[10px] font-mono text-[var(--text-muted)]">C++20</span>
            </div>

            <!-- Контейнер под код/Monaco Editor -->
            <div id="monaco-editor-container" class="flex-1 w-full h-full bg-[#1e1e1e]"></div>
        </main>

        <!-- 3. ПРАВАЯ ПАНЕЛЬ: РЕНДЕР И ТЕСТЫ -->
        <aside class="w-80 bg-[var(--bg-panel)] border-l border-[var(--border-color)] flex flex-col shrink-0 overflow-hidden">
            
            <!-- Окно Canvas -->
            <div class="h-1/2 border-b border-[var(--border-color)] p-3 flex flex-col space-y-2">
                <div class="text-[11px] font-bold text-[var(--text-main)] uppercase tracking-wider flex justify-between items-center">
                    <span>Визуализация</span>
                    <span class="text-[10px] font-mono text-pink-400">Viewport</span>
                </div>
                <div class="flex-1 bg-black rounded-xl border border-[var(--border-color)] overflow-hidden relative flex items-center justify-center">
                    <canvas id="lab-canvas" class="w-full h-full object-contain"></canvas>
                </div>
            </div>

            <!-- Табло Юнит-Тестов -->
            <div class="h-1/2 p-3 flex flex-col space-y-2 bg-[var(--bg-card)] overflow-hidden">
                <div class="text-[11px] font-bold text-[var(--text-main)] uppercase tracking-wider flex justify-between items-center">
                    <span>Юнит-тесты</span>
                    <span id="tests-status-count" class="text-[10px] font-mono text-gray-400">0 / 0 Passed</span>
                </div>

                <!-- ДИНАМИЧЕСКИЙ СПИСОК ТЕСТОВ -->
                <div id="tests-container" class="flex-1 overflow-y-auto space-y-2 pr-1">
                    <div class="text-xs text-[var(--text-muted)] p-2">Загрузка тестов...</div>
                </div>
            </div>

        </aside>
    </div>

    <!-- СКРИПТЫ: Сначала переключение темы, затем загрузчик данных -->
    <script src="src/ui.js"></script>
    <script src="src/loader.js"></script>
    <script src="src/runner.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
</body>
</html>
