<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VirtualLab — Лабораторные работы</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-module="labs" class="min-h-screen flex flex-col font-sans select-none">
    <header class="ui-header h-14 px-4 flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-4">
            <a href="../index.html" class="ui-btn ui-btn-secondary py-1.5 px-2.5">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Главная</span>
            </a>

            <div class="h-4 w-px bg-[var(--border-color)]"></div>

            <div class="flex items-center space-x-2.5">
                <span class="w-2.5 h-2.5 rounded-full bg-[var(--accent)] animate-pulse"></span>
                <h1 class="text-base font-extrabold tracking-wide text-[var(--text-main)]">
                    VirtualLab <span class="text-xs font-semibold text-emerald-500">Workspace</span>
                </h1>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <button id="theme-toggle" type="button" class="ui-theme-btn">Светлая</button>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-6 md:p-8 space-y-8">     
        <div class="ui-card flex flex-col md:flex-row justify-between items-start md:items-center gap-4 p-6">
            <div class="space-y-1">
                <h2 class="text-2xl font-bold tracking-tight">Интерактивные лабораторные работы</h2>
                <p class="text-xs text-[var(--text-muted)] max-w-2xl">
                    Дорабатывайте алгоритмы рендеринга, запускайте автоматические юнит-тесты и визуализируйте работу графического ядра.
                </p>
            </div>

            <div class="flex space-x-3 text-center shrink-0">
                <div class="ui-subcard px-4 py-2.5">
                    <div id="stat-passed-labs" class="text-base font-extrabold text-emerald-500 font-mono">0 / 0</div>
                    <div class="text-[10px] text-[var(--text-muted)] font-semibold uppercase">Пройдено</div>
                </div>

                <div class="ui-subcard px-4 py-2.5">
                    <div id="stat-avg-score" class="text-base font-extrabold text-pink-500 font-mono">0%</div>
                    <div class="text-[10px] text-[var(--text-muted)] font-semibold uppercase">Прогресс</div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="labs-grid"></div>
    </main>

    <script src="../src/skeleton.js"></script>
    <script src="../src/toast.js"></script>
    <script src="src/ui.js"></script>
    <script src="../src/theme.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</body>
</html>
