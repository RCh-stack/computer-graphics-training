<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактор страницы | VirtualLab Edu</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> 
</head>
<body data-module="theory" class="font-sans min-h-screen">
    <header class="ui-header">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="text-xs text-blue-500 hover:underline flex items-center gap-2 font-semibold">
                <i class="fa-solid fa-arrow-left"></i> Назад к списку глав
            </a>

            <div class="flex items-center gap-3">
                <button id="btn-save-lesson" type="button" class="ui-btn ui-btn-primary">
                    <i class="fa-solid fa-floppy-disk"></i> Сохранить страницу
                </button>

                <button id="theme-toggle" type="button" class="ui-theme-btn">Светлая</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <section class="lg:col-span-8 space-y-4">
                <div class="ui-card p-5 space-y-4">
                    <div>
                        <label class="block text-[11px] font-semibold uppercase text-[var(--text-muted)] mb-1">Название статьи</label>
                        <input type="text" id="lesson-title" class="ui-input w-full px-3.5 py-2 text-sm font-bold">
                    </div>

                    <div>
                        <label class="block text-[11px] font-semibold uppercase text-[var(--text-muted)] mb-2">Содержимое учебного материала</label>
                        <div id="quill-editor-container"></div>
                    </div>
                </div>
            </section>

            <aside class="lg:col-span-4 space-y-4">
                <div class="ui-card p-5 space-y-4">
                    <div class="flex justify-between items-center ui-divider-b pb-2">
                        <h3 class="text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">Интерактивные виджеты</h3>
                        <button id="btn-add-widget" type="button" class="text-xs text-blue-500 hover:underline font-semibold">+ Виджет</button>
                    </div>

                    <div id="widgets-list-container" class="space-y-3"></div>
                </div>
            </aside>
        </div>
    </main>

    <script src="../../src/skeleton.js"></script>
    <script src="../../src/toast.js"></script>
    <script src="src/editor.js"></script>
    <script src="../../src/theme.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>   
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
</body>
</html>
