<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактор страницы | VirtualLab Edu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">  
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet" />
    <link rel="stylesheet" href="../../style.css">
</head>
<body class="bg-[var(--bg-panel)] text-[var(--text-main)] font-sans min-h-screen">

    <!-- Header -->
    <header class="bg-[var(--bg-panel)] border-b border-[var(--border-color)] sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="text-xs text-blue-400 hover:underline flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> Назад к списку глав
            </a>
            <button id="btn-save-lesson" class="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl text-xs transition shadow-lg shadow-blue-600/20 flex items-center gap-2">
                <i class="fa-solid fa-floppy-disk"></i> Сохранить страницу
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- ЛЕВАЯ КОЛОНКА: Визуальный редактор -->
            <section class="lg:col-span-8 space-y-4">
                <div class="bg-[var(--bg-card)] p-5 rounded-2xl border border-gray-700 space-y-4">
                    <div>
                        <label class="block text-[11px] font-semibold uppercase text-[var(--text-main)] mb-1">Название статьи</label>
                        <input type="text" id="lesson-title" class="w-full px-3.5 py-2 bg-[var(--bg-panel)] border border-gray-700 rounded-xl text-sm font-bold focus:outline-none focus:border-blue-500">
                    </div>

                    <div>
                        <label class="block text-[11px] font-semibold uppercase text-[var(--text-main)] mb-2">Содержимое учебного материала</label>
                        
                        <div id="quill-editor-container"></div>
                    </div>
                </div>
            </section>

            <!-- ПРАВАЯ КОЛОНКА: Виджеты (widgets_config) -->
            <aside class="lg:col-span-4 space-y-4">
                <div class="bg-[var(--bg-card)] p-5 rounded-2xl border border-gray-700 space-y-4">
                    <div class="flex justify-between items-center border-b border-gray-700/60 pb-2">
                        <h3 class="text-xs font-bold text-[var(--text-main)] uppercase tracking-wider">Интерактивные виджеты</h3>
                        <button id="btn-add-widget" type="button" class="text-xs text-blue-400 hover:underline font-semibold">+ Виджет</button>
                    </div>

                    <div id="widgets-list-container" class="space-y-3">
                        <!-- Карточки конфигураций виджетов -->
                    </div>
                </div>
            </aside>

        </div>
    </main>

    <script src="src/editor.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>   
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
</body>
</html>
