<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конструктор теста | VirtualLab Edu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="../../style.css">
</head>
<body class="bg-[var(--bg-panel)] text-[var(--text-main)] font-sans min-h-screen">

    <!-- Верхняя панель управления -->
    <header class="bg-[var(--bg-panel)] border-b border-[var(--border-color)] sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="text-xs text-pink-400 hover:underline flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> К списку тестов
            </a>
            <div class="flex items-center gap-3">
                <button id="btn-save-test" class="px-5 py-2 bg-pink-600 hover:bg-pink-500 text-white font-semibold rounded-xl text-xs transition shadow-lg shadow-pink-600/20 flex items-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> Сохранить тест
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- ЛЕВАЯ КОЛОНКА: Навигация по вопросам -->
            <aside class="lg:col-span-3 space-y-4">
                <div class="bg-[var(--bg-card)] p-4 rounded-2xl border border-gray-700 space-y-3">
                    <div class="flex justify-between items-center border-b border-gray-700/60 pb-2">
                        <span class="text-xs font-bold text-[var(--text-main)] uppercase tracking-wider">Список вопросов</span>
                        <span id="questions-counter" class="text-xs font-mono text-pink-400 font-bold">0</span>
                    </div>

                    <!-- Панель номеров вопросов -->
                    <div id="questions-nav-list" class="grid grid-cols-4 gap-2 max-h-[400px] overflow-y-auto pr-1">
                        <!-- Динамические кнопки 1, 2, 3... -->
                    </div>

                    <button id="btn-add-question" type="button" class="w-full py-2.5 bg-[var(--bg-card)] hover:bg-pink-500 text-black border border-pink-500/30 rounded-xl text-xs font-semibold transition flex items-center justify-center gap-2 mt-2">
                        <i class="fa-solid fa-plus"></i> Добавить вопрос
                    </button>
                </div>
            </aside>

            <!-- ЦЕНТРАЛЬНАЯ КОЛОНКА: Редактирование выбранного вопроса -->
            <section class="lg:col-span-6 space-y-4">
                <div id="editor-empty-state" class="hidden bg-[var(--bg-card)] p-12 rounded-2xl border border-gray-700 text-center text-[var(--text-main)] text-xs">
                    Вопросы пока не созданы. Нажмите «Добавить вопрос» слева.
                </div>

                <div id="question-editor-card" class="bg-[var(--bg-card)] p-6 rounded-2xl border border-gray-700 space-y-5">
                    <div class="flex justify-between items-center border-b border-gray-700/60 pb-3">
                        <h2 class="text-sm font-bold text-pink-400 font-mono" id="active-question-header">Вопрос #1</h2>
                        <button id="btn-delete-active-q" type="button" class="text-xs text-red-400 hover:underline flex items-center gap-1">
                            <i class="fa-solid fa-trash"></i> Удалить вопрос
                        </button>
                    </div>

                    <!-- Текст вопроса -->
                    <div>
                        <label class="block text-[11px] font-semibold uppercase text-[var(--text-main)] mb-1">Формулировка вопроса</label>
                        <textarea id="q-text" rows="3" class="w-full px-3.5 py-2.5 bg-[var(--bg-panel)] border border-gray-700 rounded-xl text-xs focus:outline-none focus:border-pink-500" placeholder="Введите условие задачи или вопрос..."></textarea>
                    </div>

                    <!-- Выбор типа ответа -->
                    <div>
                        <label class="block text-[11px] font-semibold uppercase text-[var(--text-main)] mb-1">Тип ответа</label>
                        <select id="q-type" class="w-full px-3.5 py-2.5 bg-[var(--bg-panel)] border border-gray-700 rounded-xl text-xs focus:outline-none focus:border-pink-500">
                            <option value="single_choice">Выбор из вариантов (Single Choice)</option>
                            <option value="text_input">Текстовый ответ (Text Input)</option>
                            <option value="numeric_input">Числовой ответ (Numeric Input)</option>
                        </select>
                    </div>

                    <!-- Блок параметров вариантов ответа (для single_choice) -->
                    <div id="options-manager-block" class="space-y-3 pt-2">
                        <label class="block text-[11px] font-semibold uppercase text-[var(--text-main)]">
                            Варианты ответов (отметьте правильный):
                        </label>
                        <div id="options-list-container" class="space-y-2">
                            <!-- Список вариантов с радиокнопками -->
                        </div>
                        <button id="btn-add-option" type="button" class="text-xs text-pink-400 hover:underline font-semibold flex items-center gap-1 pt-1">
                            <i class="fa-solid fa-plus"></i> Добавить вариант
                        </button>
                    </div>

                    <!-- Блок ввода правильного ответа (для text_input / numeric_input) -->
                    <div id="direct-answer-block" class="hidden pt-2">
                        <label class="block text-[11px] font-semibold uppercase text-[var(--text-main)] mb-1">Точный правильный ответ</label>
                        <input type="text" id="q-direct-correct" class="w-full px-3.5 py-2.5 bg-[var(--bg-panel)] border border-gray-700 rounded-xl text-xs focus:outline-none focus:border-pink-500" placeholder="Например: 42 или vec3(1.0)">
                    </div>

                    <!-- Дополнительно: Код и Медиа -->
                    <div class="border-t border-gray-700/60 pt-4 space-y-3">
                        <div>
                            <label class="block text-[11px] font-semibold uppercase text-[var(--text-main)] mb-1"><i class="fa-solid fa-code mr-1"></i> Фрагмент кода (C++ / GLSL)</label>
                            <textarea id="q-code-snippet" rows="3" class="w-full font-mono px-3 py-2 bg-[var(--bg-panel)] border border-gray-700 rounded-xl text-xs text-pink-300 focus:outline-none focus:border-pink-500" placeholder="// Optional code snippet..."></textarea>
                        </div>

                        <div>
                            <label class="block text-[11px] font-semibold uppercase text-[var(--text-main)] mb-1"><i class="fa-solid fa-image mr-1"></i> Ссылка на изображение (Media URL)</label>
                            <input type="text" id="q-media-url" class="w-full px-3.5 py-2 bg-[var(--bg-panel)] border border-gray-700 rounded-xl text-xs focus:outline-none focus:border-pink-500" placeholder="https://example.com/diagram.png">
                        </div>

                        <div>
                            <label class="block text-[11px] font-semibold uppercase text-[var(--text-main)] mb-1">Пояснение к решению</label>
                            <input type="text" id="q-explanation" class="w-full px-3.5 py-2 bg-[var(--bg-panel)] border border-gray-700 rounded-xl text-xs focus:outline-none focus:border-pink-500" placeholder="Объяснение, показываемое после сдачи теста">
                        </div>
                    </div>
                </div>
            </section>

            <!-- ПРАВАЯ КОЛОНКА: Настройки самого теста -->
            <aside class="lg:col-span-3 space-y-4">
                <div class="bg-[var(--bg-card)] p-5 rounded-2xl border border-gray-700 space-y-4">
                    <h3 class="text-xs font-bold text-[var(--text-main)] uppercase tracking-wider border-b border-gray-700/60 pb-2">Параметры теста</h3>

                    <div>
                        <label class="block text-[11px] font-semibold uppercase text-[var(--text-main)] mb-1">Название</label>
                        <input type="text" id="test-title" class="w-full px-3 py-2 bg-[var(--bg-panel)] border border-gray-700 rounded-xl text-xs focus:outline-none focus:border-pink-500">
                    </div>

                    <div>
                        <label class="block text-[11px] font-semibold uppercase text-[var(--text-main)] mb-1">Описание</label>
                        <textarea id="test-description" rows="2" class="w-full px-3 py-2 bg-[var(--bg-panel)] border border-gray-700 rounded-xl text-xs focus:outline-none focus:border-pink-500"></textarea>
                    </div>

                    <div>
                        <label class="block text-[11px] font-semibold uppercase text-[var(--text-main)] mb-1">Сложность</label>
                        <select id="test-difficulty" class="w-full px-3 py-2 bg-[var(--bg-panel)] border border-gray-700 rounded-xl text-xs focus:outline-none focus:border-pink-500">
                            <option value="Легкий">Легкий</option>
                            <option value="Средний">Средний</option>
                            <option value="Сложный">Сложный</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-[11px] font-semibold uppercase text-[var(--text-main)] mb-1">Таймер (минут)</label>
                        <input type="number" id="test-time-limit" min="1" value="15" class="w-full px-3 py-2 bg-[var(--bg-panel)] border border-gray-700 rounded-xl text-xs focus:outline-none focus:border-pink-500">
                    </div>

                    <div class="flex items-center gap-2 pt-1">
                        <input type="checkbox" id="test-is-unlocked" class="w-4 h-4 accent-pink-500 rounded cursor-pointer">
                        <label for="test-is-unlocked" class="text-xs text-[var(--text-main)] cursor-pointer">Открыт для прохождения</label>
                    </div>
                </div>
            </aside>

        </div>
    </main>

    <script src="src/loader.js"></script>
    <script src="src/workspace.js"></script>
</body>
</html>
