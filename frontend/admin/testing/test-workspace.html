<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конструктор теста | VirtualLab Edu</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-module="testing" class="font-sans min-h-screen">
    <header class="ui-header">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="text-xs text-amber-500 hover:underline flex items-center gap-2 font-semibold">
                <i class="fa-solid fa-arrow-left"></i> К списку тестов
            </a>

            <div class="flex items-center gap-3">
                <button id="btn-save-test" type="button" class="ui-btn ui-btn-primary">
                    <i class="fa-solid fa-floppy-disk"></i> Сохранить тест
                </button>

                <button id="theme-toggle" type="button" class="ui-theme-btn">Светлая</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">        
            <aside class="lg:col-span-3 space-y-4">
                <div class="ui-card p-4 space-y-3">
                    <div class="flex justify-between items-center ui-divider-b pb-2">
                        <span class="text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">Список вопросов</span>
                        <span id="questions-counter" class="text-xs font-mono text-amber-500 font-bold">0</span>
                    </div>

                    <div id="questions-nav-list" class="grid grid-cols-4 gap-2 max-h-[400px] overflow-y-auto pr-1"></div>

                    <button id="btn-add-question" type="button" class="ui-btn ui-btn-soft w-full mt-2">
                        <i class="fa-solid fa-plus"></i> Добавить вопрос
                    </button>
                </div>
            </aside>

            <section class="lg:col-span-6 space-y-4">
                <div id="editor-empty-state" class="hidden ui-card p-12 text-center text-[var(--text-muted)] text-xs">
                    Вопросы пока не созданы. Нажмите «Добавить вопрос» слева.
                </div>

                <div id="question-editor-card" class="ui-card p-6 space-y-5">
                    <div class="flex justify-between items-center ui-divider-b pb-3">
                        <h2 class="text-sm font-bold text-amber-500 font-mono" id="active-question-header">Вопрос №1</h2>
                        <button id="btn-delete-active-q" type="button" class="text-xs text-rose-500 hover:underline flex items-center gap-1 font-medium">
                            <i class="fa-solid fa-trash"></i> Удалить вопрос
                        </button>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="block text-[11px] font-semibold uppercase text-[var(--text-muted)]">Формулировка вопроса</label>
                            <button type="button" onclick="openMathEditorFor('q-text')" class="text-xs text-amber-500 hover:underline flex items-center gap-1 font-medium">
                                <i class="fa-solid fa-calculator"></i> Формула
                            </button>
                        </div>
                        <textarea id="q-text" rows="3" class="ui-textarea w-full px-3.5 py-2.5" placeholder="Введите условие задачи или вопрос..."></textarea>
                    </div>

                    <div>
                        <label class="block text-[11px] font-semibold uppercase text-[var(--text-muted)] mb-1">Тип ответа</label>
                        <select id="q-type" class="ui-select w-full px-3.5 py-2.5">
                            <option value="single_choice">Выбор из вариантов (Single Choice)</option>
                            <option value="text_input">Текстовый ответ (Text Input)</option>
                            <option value="numeric_input">Числовой ответ (Numeric Input)</option>
                        </select>
                    </div>

                    <div id="options-manager-block" class="space-y-3 pt-2">
                        <label class="block text-[11px] font-semibold uppercase text-[var(--text-muted)]">
                            Варианты ответов (отметьте правильный):
                        </label>
                        <div id="options-list-container" class="space-y-2"></div>

                        <button id="btn-add-option" type="button" class="text-xs text-amber-500 hover:underline font-semibold flex items-center gap-1 pt-1">
                            <i class="fa-solid fa-plus"></i> Добавить вариант
                        </button>
                    </div>

                    <div id="direct-answer-block" class="hidden pt-2">
                        <label class="block text-[11px] font-semibold uppercase text-[var(--text-muted)] mb-1">Точный правильный ответ</label>
                        <input type="text" id="q-direct-correct" class="ui-input w-full px-3.5 py-2.5" placeholder="Например: 42 или vec3(1.0)">
                    </div>

                    <div class="ui-divider-t pt-4 space-y-3">
                        <div>
                            <label class="block text-[11px] font-semibold uppercase text-[var(--text-muted)] mb-1"><i class="fa-solid fa-code mr-1"></i> Фрагмент кода (C++ / GLSL)</label>
                            <textarea id="q-code-snippet" rows="3" class="ui-textarea w-full font-mono px-3 py-2 text-amber-500" placeholder="// Optional code snippet..."></textarea>
                        </div>

                        <div>
                            <label class="block text-[11px] font-semibold uppercase text-[var(--text-muted)] mb-1"><i class="fa-solid fa-image mr-1"></i> Ссылка на изображение (Media URL)</label>
                            <input type="text" id="q-media-url" class="ui-input w-full px-3.5 py-2" placeholder="https://example.com/diagram.png">
                        </div>

                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label class="block text-[11px] font-semibold uppercase text-[var(--text-muted)]">Пояснение к решению</label>
                                <button type="button" onclick="openMathEditorFor('q-explanation')" class="text-xs text-amber-500 hover:underline flex items-center gap-1 font-medium">
                                    <i class="fa-solid fa-calculator"></i> Формула
                                </button>
                            </div>
                            <input type="text" id="q-explanation" class="ui-input w-full px-3.5 py-2" placeholder="Объяснение, показываемое после сдачи теста">
                        </div>
                    </div>
                </div>
            </section>

            <aside class="lg:col-span-3 space-y-4">
                <div class="ui-card p-5 space-y-4">
                    <h3 class="text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider ui-divider-b pb-2">Параметры теста</h3>

                    <div>
                        <label class="block text-[11px] font-semibold uppercase text-[var(--text-muted)] mb-1">Название</label>
                        <input type="text" id="test-title" class="ui-input w-full px-3 py-2">
                    </div>

                    <div>
                        <label class="block text-[11px] font-semibold uppercase text-[var(--text-muted)] mb-1">Описание</label>
                        <textarea id="test-description" rows="2" class="ui-textarea w-full px-3 py-2"></textarea>
                    </div>

                    <div>
                        <label class="block text-[11px] font-semibold uppercase text-[var(--text-muted)] mb-1">Сложность</label>
                        <select id="test-difficulty" class="ui-select w-full px-3 py-2">
                            <option value="Легкий">Легкий</option>
                            <option value="Средний">Средний</option>
                            <option value="Сложный">Сложный</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-[11px] font-semibold uppercase text-[var(--text-muted)] mb-1">Таймер (минут)</label>
                        <input type="number" id="test-time-limit" min="1" value="15" class="ui-input w-full px-3 py-2">
                    </div>

                    <div class="pt-1">
                        <label for="test-is-unlocked" class="ui-switch">
                            <input type="checkbox" id="test-is-unlocked">
                            <span class="text-xs font-medium text-[var(--text-main)]">Открыт для прохождения</span>
                        </label>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <div id="math-editor-modal" class="hidden ui-modal-backdrop">
        <div class="ui-modal-card w-full max-w-lg animate-fade-in">
            <div class="ui-modal-header">
                <h3 class="text-sm font-bold text-[var(--text-main)]">Конструктор формул</h3>
                <button id="btn-close-math-modal" type="button" class="text-[var(--text-muted)] hover:text-[var(--text-main)] p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
    
            <div class="p-6 space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-[var(--text-muted)] mb-2">Введите или соберите формулу:</label>
                    <math-field id="formula-input-field"
                        class="w-full p-3 rounded-xl border border-[var(--border-color)] bg-[var(--bg-elevated)] text-[var(--text-main)] text-lg focus:outline-none focus:border-amber-500">
                        \mathbf{a} \cdot \mathbf{b}
                    </math-field>
                </div>
        
                <div class="space-y-1.5">
                    <label class="block text-[11px] font-bold text-[var(--text-muted)] uppercase tracking-wider">Быстрые символы:</label>
                    <div class="flex flex-wrap gap-1.5">
                        <button type="button" onclick="insertSymbol('\\cdot')" class="ui-btn ui-btn-secondary py-1 px-2.5 font-mono">• Скаляр</button>
                        <button type="button" onclick="insertSymbol('\\times')" class="ui-btn ui-btn-secondary py-1 px-2.5 font-mono">× Векторное</button>
                        <button type="button" onclick="insertSymbol('\\mathbf{v}')" class="ui-btn ui-btn-secondary py-1 px-2.5 font-mono">v Вектор</button>
                        <button type="button" onclick="insertSymbol('\\frac{a}{b}')" class="ui-btn ui-btn-secondary py-1 px-2.5 font-mono">a/b Дробь</button>
                        <button type="button" onclick="insertSymbol('\\sqrt{x}')" class="ui-btn ui-btn-secondary py-1 px-2.5 font-mono">√ Корень</button>
                    </div>
                </div>
            </div>
    
            <div class="ui-modal-footer">
                <button id="btn-cancel-math" type="button" class="ui-btn ui-btn-secondary">Отмена</button>
                <button id="btn-insert-math" type="button" class="ui-btn ui-btn-primary">Добавить в строку</button>
            </div>  
        </div>
    </div>

    <script src="../../src/draft-guard.js"></script>
    <script src="../../src/skeleton.js"></script>
    <script src="../../src/toast.js"></script>
    <script src="src/workspace.js"></script>
    <script src="../../src/theme.js"></script>
    <script src="https://unpkg.com/mathlive"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
