<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление лабораторными работами | VirtualLab Edu</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-module="labs" class="font-sans min-h-screen">
    <header class="ui-header">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="../../index.html" class="flex items-center space-x-3">
                <i class="fa-solid fa-graduation-cap text-pink-500 text-2xl"></i>
                <span class="text-xl font-bold tracking-wide">VirtualLab <span class="text-pink-500">Edu</span> <span class="text-xs ml-2 px-2 py-0.5 rounded bg-emerald-500/15 text-emerald-500 border border-emerald-500/25">Лабораторные</span></span>
            </a>

            <div class="flex items-center gap-3">
                <button id="theme-toggle" type="button" class="ui-theme-btn">Светлая</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 space-y-6">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 ui-divider-b pb-4">
            <div>
                <h1 class="text-2xl font-bold">Конструктор лабораторных работ</h1>
                <p class="text-xs text-[var(--text-muted)] mt-1">Редактирование исходного кода, инструкций и unit-тестов</p>
            </div>

            <button id="btn-create-lab" type="button" class="ui-btn ui-btn-primary">
                <i class="fa-solid fa-plus"></i> Создать лаб. работу
            </button>
        </div>

        <div id="labs-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <script src="../../src/skeleton.js"></script>
    <script src="../../src/toast.js"></script>
    <script src="src/loader.js"></script>
    <script src="../../src/theme.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
