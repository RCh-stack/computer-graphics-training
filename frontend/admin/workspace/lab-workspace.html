<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конструктор лабораторной работы | VirtualLab Edu</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-module="labs" class="font-sans min-h-screen">
    <header class="ui-header">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="text-xs text-emerald-500 hover:underline flex items-center gap-2 font-semibold">
                <i class="fa-solid fa-arrow-left"></i> К списку лабораторных
            </a>

            <div class="flex items-center gap-3">
                <button id="btn-save-lab" type="button" class="ui-btn ui-btn-primary">
                    <i class="fa-solid fa-floppy-disk"></i> Сохранить работу
                </button>

                <button id="theme-toggle" type="button" class="ui-theme-btn">Светлая</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">           
            <aside class="lg:col-span-4 space-y-4">              
                <div class="ui-card p-4 space-y-3">
                    <h3 class="text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider ui-divider-b pb-2">
                        Параметры работы
                    </h3>

                    <div>
                        <label class="block text-[11px] font-semibold uppercase text-[var(--text-muted)] mb-1">Название работы</label>
                        <input type="text" id="lab-title" class="ui-input w-full px-3 py-2">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[11px] font-semibold uppercase text-[var(--text-muted)] mb-1">Сложность</label>
                            <select id="lab-difficulty" class="ui-select w-full px-3 py-2">
                                <option value="Легкий">Легкий</option>
                                <option value="Средний">Средний</option>
                                <option value="Сложный">Сложный</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-[11px] font-semibold uppercase text-[var(--text-muted)] mb-1">Порядковый №</label>
                            <input type="number" id="lab-order" min="0" class="ui-input w-full px-3 py-2">
                        </div>
                    </div>

                    <div class="pt-1">
                        <label for="lab-is-unlocked" class="ui-switch">
                            <input type="checkbox" id="lab-is-unlocked">
                            <span class="text-xs font-medium text-[var(--text-main)]">Открыта для студентов</span>
                        </label>
                    </div>
                </div>

                <div class="ui-card p-4 space-y-3">
                    <h3 class="text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider ui-divider-b pb-2">
                        <i class="fa-solid fa-list-check text-emerald-500 mr-1"></i> Задание (task_json)
                    </h3>

                    <div>
                        <label class="block text-[11px] font-semibold uppercase text-[var(--text-muted)] mb-1">Заголовок задания</label>
                        <input type="text" id="task-title" class="ui-input w-full px-3 py-2">
                    </div>

                    <div>
                        <label class="block text-[11px] font-semibold uppercase text-[var(--text-muted)] mb-1">Инструкция</label>
                        <textarea id="task-instruction" rows="2" class="ui-textarea w-full px-3 py-2"></textarea>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="text-[11px] font-semibold uppercase text-[var(--text-muted)]">Требования к выполнению</label>
                            <button type="button" id="btn-add-req" class="text-xs text-emerald-500 hover:underline font-semibold">+ Добавить</button>
                        </div>

                        <div id="requirements-list" class="space-y-2 max-h-36 overflow-y-auto pr-1"></div>
                    </div>
                </div>

                <div class="ui-card p-4 space-y-2">
                    <label class="block text-[11px] font-semibold uppercase text-[var(--text-muted)]">Описание работы</label>
                    <textarea id="lab-description" rows="3" class="ui-textarea w-full px-3 py-2" placeholder="Подробная теория или алгоритм решения..."></textarea>
                </div>
            </aside>

            <section class="lg:col-span-5 space-y-4">
                <div class="ui-card p-4 space-y-3 h-full flex flex-col">
                    <div class="flex justify-between items-center ui-divider-b pb-2">
                        <h3 class="text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">
                            <i class="fa-solid fa-code text-emerald-500 mr-1"></i> Шаблоны кода (template_code)
                        </h3>
                        
                        <select id="admin-template-lang-select" class="ui-select text-emerald-500 font-mono px-2.5 py-1 cursor-pointer">
                            <option value="cpp">C++ 15</option>
                            <option value="python">Python 3</option>
                            <option value="csharp">C# (.NET)</option>
                            <option value="go">Go</option>
                        </select>
                    </div>
                    
                    <div class="flex-1 min-h-[500px]">
                        <textarea id="lab-template-code" class="w-full h-full font-mono text-xs p-4 bg-[#0c0c0e] border border-[var(--border-color)] rounded-xl text-emerald-400 focus:outline-none focus:border-emerald-500 leading-relaxed resize-none" spellcheck="false" placeholder="// Введите код шаблона для выбранного языка..."></textarea>
                    </div>
                </div>
            </section>

            <aside class="lg:col-span-3 space-y-4">
                <div class="ui-card p-4 space-y-4">                
                    <div class="flex justify-between items-center ui-divider-b pb-2">
                        <span class="text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">Тест-кейсы</span>
                        <span id="testcases-counter" class="text-xs font-mono text-emerald-500 font-bold">0</span>
                    </div>

                    <div id="testcase-nav-list" class="grid grid-cols-4 gap-2 max-h-40 overflow-y-auto pr-1"></div>

                    <button id="btn-add-testcase" type="button" class="ui-btn ui-btn-soft w-full">
                        <i class="fa-solid fa-plus"></i> Добавить тест-кейс
                    </button>

                    <div id="tc-empty-state" class="hidden p-6 text-center text-[var(--text-muted)] text-xs border border-dashed border-[var(--border-strong)] rounded-xl">
                        Тест-кейсы отсутствуют. Нажмите «Добавить тест-кейс».
                    </div>

                    <div id="tc-editor-card" class="space-y-3 pt-2 ui-divider-t">
                        <div class="flex justify-between items-center">
                            <span id="active-tc-header" class="text-xs font-bold font-mono text-emerald-500">Тест #1</span>
                            <button id="btn-delete-active-tc" type="button" class="text-[11px] text-rose-500 hover:underline font-medium">
                                <i class="fa-solid fa-trash mr-1"></i> Удалить
                            </button>
                        </div>

                        <div>
                            <label class="block text-[10px] uppercase font-semibold text-[var(--text-muted)] mb-1">Название тест-кейса</label>
                            <input type="text" id="tc-name" class="ui-input w-full px-2.5 py-1.5">
                        </div>

                        <div>
                            <label class="block text-[10px] uppercase font-semibold text-[var(--text-muted)] mb-1">Входные данные (stdin)</label>
                            <textarea id="tc-input" rows="2" class="ui-textarea w-full px-2.5 py-1.5 font-mono" placeholder="Параметры..."></textarea>
                        </div>

                        <div>
                            <label class="block text-[10px] uppercase font-semibold text-[var(--text-muted)] mb-1">Ожидаемый вывод (stdout)</label>
                            <textarea id="tc-output" rows="2" class="ui-textarea w-full px-2.5 py-1.5 font-mono" placeholder="Результат..."></textarea>
                        </div>

                        <div>
                            <label class="block text-[10px] uppercase font-semibold text-[var(--text-muted)] mb-1">Таймаут (мс)</label>
                            <input type="number" id="tc-timeout" min="100" step="100" class="ui-input w-full px-2.5 py-1.5 font-mono">
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <script src="../../src/draft-guard.js"></script>
    <script src="../../src/skeleton.js"></script>
    <script src="../../src/toast.js"></script>
    <script src="src/workspace.js"></script>
    <script src="../../src/theme.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
