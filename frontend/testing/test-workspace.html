<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VirtualLab — Тестирование</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <link rel="stylesheet" href="../style.css">
</head>
<body class="bg-[var(--bg-main)] text-[var(--text-main)] h-screen overflow-hidden flex flex-col font-sans select-none">

    <!-- ВЕРХНИЙ БАР -->
    <header class="h-14 bg-[var(--bg-panel)] border-b border-[var(--border-color)] px-4 flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-4">
            <a href="index.html" class="flex items-center space-x-1.5 bg-[var(--bg-card)] hover:bg-gray-800 border border-[var(--border-color)] px-2.5 py-1 rounded-lg text-xs font-semibold transition">
                <span>← Выход</span>
            </a>
            <div class="h-4 w-px bg-[var(--border-color)]"></div>
            <h1 id="test-title" class="text-base font-extrabold tracking-wide">
                Загрузка теста...
            </h1>
        </div>

        <div class="flex items-center space-x-4">
            <!-- ТАЙМЕР -->
            <div class="flex items-center space-x-2 bg-amber-500/10 border border-amber-500/20 px-3 py-1 rounded-lg text-amber-400 font-mono text-xs font-bold">
                <span>⏱️ Оставшееся время:</span>
                <span id="test-timer">--:--</span>
            </div>

            <div class="flex items-center space-x-4">
                <button id="theme-toggle" class="bg-[var(--bg-card)] border border-[var(--border-color)] text-[var(--text-main)] px-3 py-1.5 rounded-xl text-xs font-semibold hover:opacity-80 transition">
                    Светлая
                </button>
            </div>

            <button id="btn-finish-test" class="bg-pink-600 hover:bg-pink-500 text-white text-xs font-bold px-4 py-1.5 rounded-lg transition shadow-md">
                Завершить тест
            </button>
        </div>
    </header>

    <!-- ОСНОВНОЙ WORKSPACE (2 КОЛОНКИ) -->
    <div class="flex-1 flex overflow-hidden">

        <!-- 1. ЛЕВАЯ ЧАСТЬ: ТЕКУЩИЙ ВОПРОС -->
        <main class="flex-1 bg-[var(--bg-main)] p-6 overflow-y-auto flex flex-col justify-between">
            <div class="max-w-3xl w-full mx-auto space-y-6">
                
                <!-- МЕТКА ВОПРОСА -->
                <div class="flex items-center justify-between">
                    <span id="question-number-badge" class="px-2.5 py-1 rounded-lg text-xs font-mono font-semibold bg-blue-500/10 text-blue-400 border border-blue-500/20">
                        Вопрос 1
                    </span>
                    <span id="question-category" class="text-xs text-[var(--text-muted)] font-mono">
                        Категория: Math
                    </span>
                </div>

                <!-- ТЕКСТ ВОПРОСА И ФОРМУЛЫ/КОД -->
                <div class="space-y-4">
                    <h2 id="question-text" class="text-lg font-bold leading-relaxed">
                        Загрузка текста вопроса...
                    </h2>

                    <!-- КОНТЕЙНЕР ДЛЯ ВСТАВКИ КОДА/ИЗОБРАЖЕНИЙ (ЕСЛИ ЕСТЬ) -->
                    <div id="question-media-container" class="hidden"></div>
                </div>

                <!-- ВАРИАНТЫ ОТВЕТА / ПОЛЕ ВВОДА -->
                <div id="options-container" class="space-y-3 pt-2">
                    <!-- Заполняется динамически -->
                </div>
            </div>

            <!-- НАВИГАЦИЯ МЕЖДУ ВОПРОСАМИ -->
            <div class="max-w-3xl w-full mx-auto pt-6 border-t border-[var(--border-color)] flex justify-between items-center">
                <button id="btn-prev-q" class="bg-[var(--bg-card)] border border-[var(--border-color)] px-4 py-2 rounded-xl text-xs font-bold disabled:opacity-40">
                    ← Предыдущий
                </button>
                <button id="btn-next-q" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-xs font-bold">
                    Следующий →
                </button>
            </div>
        </main>

        <!-- 2. ПРАВАЯ ПАНЕЛЬ: СЕТКА ВОПРОСОВ И ПРОГРЕСС -->
        <aside class="w-72 bg-[var(--bg-panel)] border-l border-[var(--border-color)] p-4 flex flex-col justify-between shrink-0">
            <div class="space-y-4">
                <div class="text-xs font-bold text-[var(--text-main)] uppercase tracking-wider">
                    Карта вопросов
                </div>

                <!-- СЕТКА КНОПОК ВОПРОСОВ (1, 2, 3...) -->
                <div id="questions-navigation-grid" class="grid grid-cols-4 gap-2">
                    <!-- Заполняется динамически кнопками (например: синяя - отвечен, серая - пропущен) -->
                </div>
            </div>

            <!-- ЛЕГЕНДА СОСТОЯНИЙ -->
            <div class="border-t border-[var(--border-color)] pt-3 text-[11px] space-y-2 text-[var(--text-muted)]">
                <div class="flex items-center space-x-2">
                    <span class="w-3 h-3 rounded bg-blue-600 inline-block"></span>
                    <span>Отвечен</span>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="w-3 h-3 rounded bg-[var(--bg-card)] border border-[var(--border-color)] inline-block"></span>
                    <span>Не отвечен</span>
                </div>
            </div>
        </aside>
    </div>

    <script src="src/runner.js"></script>
    <script src="../src/theme.js"></script>
</body>
</html>
