<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VirtualLab — Модуль тестирования</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../style.css">
</head>
<body class="bg-[var(--bg-main)] text-[var(--text-main)] min-h-screen flex flex-col font-sans">

    <!-- ВЕРХНИЙ БАР -->
    <header class="h-16 bg-[var(--bg-panel)] border-b border-[var(--border-color)] px-6 flex items-center justify-between shrink-0 shadow-sm">
        <div class="flex items-center space-x-4">
            <a href="../index.html" class="flex items-center space-x-1.5 bg-[var(--bg-card)] hover:bg-gray-200 border border-[var(--border-color)] px-2.5 py-1 rounded-lg text-xs font-semibold transition text-[var(--text-main)]">
                <span>←</span>
                <span>Главная</span>
            </a>

            <div class="h-4 w-px bg-[var(--border-color)]"></div>

            <div class="flex items-center space-x-2">
                <span class="w-3 h-3 rounded-full bg-[var(--accent)] animate-pulse"></span>
                <h1 class="text-base font-extrabold tracking-wide text-[var(--text-main)]">VirtualLab <span class="text-xs font-normal text-indigo-400">Tests</span></h1>
            </div>
        </div>

        <div class="flex items-center space-x-4">
            <button id="theme-toggle" class="bg-[var(--bg-card)] border border-[var(--border-color)] text-[var(--text-main)] px-3 py-1.5 rounded-xl text-xs font-semibold hover:opacity-80 transition">
                🌙 Тёмная
            </button>
        </div>
    </header>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-6 space-y-6">

        <!-- СТАБИЛЬНЫЙ ДАШБОРД ПРОГРЕССА -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-[var(--bg-panel)] border border-[var(--border-color)] p-4 rounded-xl flex items-center justify-between">
                <div>
                    <div class="text-xs text-[var(--text-muted)] font-medium">Всего тестов</div>
                    <div id="stat-total-tests" class="text-2xl font-black mt-1">0</div>
                </div>
                <div class="w-10 h-10 rounded-lg bg-blue-500/10 border border-blue-500/20 flex items-center justify-center text-blue-400 font-bold">
                    📝
                </div>
            </div>

            <div class="bg-[var(--bg-panel)] border border-[var(--border-color)] p-4 rounded-xl flex items-center justify-between">
                <div>
                    <div class="text-xs text-[var(--text-muted)] font-medium">Пройдено тестов</div>
                    <div id="stat-passed-tests" class="text-2xl font-black mt-1 text-emerald-400">0</div>
                </div>
                <div class="w-10 h-10 rounded-lg bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 font-bold">
                    ✓
                </div>
            </div>

            <div class="bg-[var(--bg-panel)] border border-[var(--border-color)] p-4 rounded-xl flex items-center justify-between">
                <div>
                    <div class="text-xs text-[var(--text-muted)] font-medium">Средний результат</div>
                    <div id="stat-avg-score" class="text-2xl font-black mt-1 text-pink-400">0%</div>
                </div>
                <div class="w-10 h-10 rounded-lg bg-pink-500/10 border border-pink-500/20 flex items-center justify-center text-pink-400 font-bold">
                    📊
                </div>
            </div>
        </div>

        <!-- СЕКЦИЯ КАТАЛОГА ТЕСТОВ -->
        <div class="space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-lg font-bold">Доступные тестирования</h2>
                <!-- Фильтрация -->
                <div class="flex space-x-2 text-xs">
                    <button class="test-filter-btn active bg-pink-600 text-white px-3 py-1 rounded-lg font-semibold" data-filter="all">Все</button>
                    <button class="test-filter-btn bg-[var(--bg-card)] border border-[var(--border-color)] px-3 py-1 rounded-lg font-semibold" data-filter="available">Доступные</button>
                    <button class="test-filter-btn bg-[var(--bg-card)] border border-[var(--border-color)] px-3 py-1 rounded-lg font-semibold" data-filter="completed">Пройденные</button>
                </div>
            </div>

            <!-- СПИСОК КАРТОЧЕК ТЕСТОВ -->
            <div id="tests-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Карточки будут динамически генерироваться через JS -->
            </div>
        </div>

    </main>

    <script src="src/ui.js"></script>
    <script src="src/loader.js"></script>
</body>
</html>
