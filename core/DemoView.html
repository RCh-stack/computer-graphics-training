<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Изолированный тест C++ WebAssembly RayTracer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col items-center justify-center p-6">

    <div class="max-w-6xl w-full space-y-6">
        
        <div class="text-center">
            <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-cyan-400">
                Изолированный тест ядра C++
            </h1>
            <p class="text-gray-400 text-sm mt-1">Проверка корректности буфера кадра и отрисовки на HTML5 Canvas</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            
            <div class="bg-gray-900 p-5 rounded-2xl border border-gray-800 space-y-6 flex flex-col justify-between">
                <div class="space-y-4">
                    <h2 class="text-lg font-bold text-indigo-400 border-b border-gray-800 pb-2">Параметры</h2>
                    
                    <div>
                        <div class="flex justify-between text-xs font-mono text-gray-400 mb-1">
                            <label for="param-fov">FOV (радианы):</label>
                            <span id="val-fov" class="text-indigo-400 font-bold">1.50</span>
                        </div>
                        <input type="range" id="param-fov" min="0.5" max="2.5" step="0.05" value="1.50" 
                               class="w-full accent-indigo-500 cursor-pointer">
                    </div>

                    <div>
                        <div class="flex justify-between text-xs font-mono text-gray-400 mb-1">
                            <label for="param-bg-color">Цвет фона:</label>
                        </div>
                        <div class="flex items-center space-x-3 bg-gray-950 p-2 rounded-xl border border-gray-800">
                            <input type="color" id="param-bg-color" value="#33b2cc" 
                                   class="w-10 h-10 bg-transparent border-0 cursor-pointer rounded-lg">
                            <span id="val-bg-color" class="text-xs font-mono text-gray-400 uppercase">#33b2cc</span>
                        </div>
                    </div>

                </div>

                <div class="space-y-3">
                    <div id="wasm-status" class="text-center p-2 rounded-xl text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20">
                        Загрузка engine.js и engine.wasm...
                    </div>
                    
                    <div id="render-time" class="text-center p-3 rounded-xl text-sm font-mono bg-gray-950 border border-gray-800 text-green-400">
                        Время рендера: -- ms
                    </div>

                    <button id="render-btn" disabled class="w-full bg-indigo-600 disabled:bg-gray-800 disabled:text-gray-500 disabled:cursor-not-allowed hover:bg-indigo-700 py-3 rounded-xl font-bold transition">
                        Рендерить кадр
                    </button>
                </div>
            </div>

            <div class="lg:col-span-3 bg-gray-900 p-4 rounded-2xl border border-gray-800 flex flex-col items-center justify-center">
                <div class="w-full flex justify-between text-xs text-gray-500 font-mono mb-2 px-1">
                    <span>Target: HTML5 Canvas Context 2D</span>
                    <span>Разрешение: 1168 x 638</span>
                </div>
                
                <div class="w-full overflow-auto border border-gray-950 rounded-xl bg-black shadow-2xl">
                    <canvas id="test-canvas" width="1168" height="638" class="block mx-auto"></canvas>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Константы разрешения (строго как в C++)
        const WIDTH = 1168;
        const HEIGHT = 638;

        // Элементы интерфейса
        const canvas = document.getElementById('test-canvas');
        const ctx = canvas.getContext('2d');
        const imgData = ctx.createImageData(WIDTH, HEIGHT);
        
        const fovInput = document.getElementById('param-fov');
        const fovLabel = document.getElementById('val-fov');
        const bgColorInput = document.getElementById('param-bg-color');
        const bgColorLabel = document.getElementById('val-bg-color');
        
        const statusDiv = document.getElementById('wasm-status');
        const timerDiv = document.getElementById('render-time');
        const renderBtn = document.getElementById('render-btn');

        // Ссылка на глобальный экземпляр C++ класса
        let cppRayTracer = null;

        // Вспомогательная функция перевода HEX-цвета (#ffffff) в Vec3f объект ({x:1, y:1, z:1})
        function hexToVec3f(hex) {
            const r = parseInt(hex.slice(1, 3), 16) / 255;
            const g = parseInt(hex.slice(3, 5), 16) / 255;
            const b = parseInt(hex.slice(5, 7), 16) / 255;
            return { x: r, y: g, z: b };
        }

        // Настройка объекта Module для Emscripten
        window.Module = {
            onRuntimeInitialized: function() {
                statusDiv.innerText = "✓ WebAssembly готов";
                statusDiv.className = "text-center p-2 rounded-xl text-xs font-semibold bg-green-500/10 text-green-400 border border-green-500/20";
                renderBtn.disabled = false;
                
                try {
                    // Создаем экземпляр C++ объекта один раз при старте
                    cppRayTracer = new Module.RayTracer(WIDTH, HEIGHT);
                    // Делаем первый пробный рендер
                    triggerRender();
                } catch (err) {
                    console.error(err);
                    statusDiv.innerText = "Ошибка биндинга класса C++";
                    statusDiv.className = "text-center p-2 rounded-xl text-xs font-semibold bg-red-500/10 text-red-400 border border-red-500/20";
                }
            }
        };

        // Основная функция пайплайна отрисовки
        function triggerRender() {
            if (!cppRayTracer) return;

            const fovValue = parseFloat(fovInput.value);
            fovLabel.innerText = fovValue.toFixed(2);

            const hexColor = bgColorInput.value;
            bgColorLabel.innerText = hexColor;

            // 1. Собираем структуру конфигурации для передачи в C++
            const background_color = hexToVec3f(hexColor); // Превращается в структуру Vec3f под капотом Wasm

            // Засекаем время
            const t0 = performance.now();

            // 3. Вызываем метод C++ вычисления сцены
            cppRayTracer.renderScene(fovValue, background_color);

            // 4. Запрашиваем у C++ адрес буфера в памяти Wasm
            const bufferPtr = cppRayTracer.getBufferPointer();

            // 5. Создаем типизированный массив JS поверх памяти WebAssembly (Zero-copy чтение)
            const memoryView = new Uint8ClampedArray(
                Module.HEAPU8.buffer,
                bufferPtr,
                WIDTH * HEIGHT * 4
            );

            // 6. Заливаем массив в ImageData нашего Canvas
            imgData.data.set(memoryView);
            
            // 7. Отрисовываем пиксели на экране
            ctx.putImageData(imgData, 0, 0);

            const t1 = performance.now();
            timerDiv.innerText = `Время рендера: ${(t1 - t0).toFixed(1)} ms`;
        }

        // Привязываем события
        renderBtn.addEventListener('click', triggerRender);
        fovInput.addEventListener('input', triggerRender);
        
        // Перерендер при смене цвета фона
        bgColorInput.addEventListener('input', triggerRender);
    </script>

    <script src="engine.js"></script>

</body>
</html>
